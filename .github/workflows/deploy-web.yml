name: Déployer la version web sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push n'annule pas un
# déploiement déjà en cours de publication.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # enablement: la v6 de cette action ne réactive plus|Pages toute seule
      # quand elle a été désactivée (ni au premier déploiement) : sans ce
      # paramètre, le job échoue sur « Get Pages site failed » et le site
      # reste inaccessible.
      - uses: actions/configure-pages@v6
        id: pages
        with:
          enablement: true

      # La configuration Firebase est lue dans firebase/firebase.env.example,
      # versionné dans le dépôt. Ce sont des identifiants de projet publics :
      # ils sont déjà présents en clair dans le bundle JS publié, donc les
      # mettre en secret n'ajouterait aucune protection réelle. Un secret
      # GitHub peut toutefois surcharger une valeur, ce qui permet de tester
      # une autre configuration sans toucher au fichier — d'où le test avant
      # chaque export : la sourcedirecte écrase ce que GitHub a fourni.
      - name: Charger la configuration Firebase
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
        run: |
          # Les valeurs lues ici sont exportees pour les steps suivants via
          # GITHUB_ENV : ce fichier n'est visible que dans le step suivant, donc
          # la validation doit porter sur les variables locales, pas sur
          # $FIREBASE_* (qui serait encore vide a ce stade).
          missing=""
          while IFS='=' read -r key value; do
            case "$key" in ''|'#'*) continue ;; esac
            # Le fichier est versionne en LF, mais un edition sous Windows peut
            # reintroduire un \r qui contaminerait la valeur transmise au build.
            key="${key%$'\r'}"
            value="${value%$'\r'}"
            eval "current=\${$key:-}"
            if [ -n "$current" ]; then
              echo "::notice::$key vient d'un secret GitHub, le fichier est ignore."
              eval "resolved_$key=\$current"
            else
              echo "$key=$value" >> "$GITHUB_ENV"
              eval "resolved_$key=\$value"
            fi
          done < firebase/firebase.env.example

          for v in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID; do
            eval "value=\${resolved_$v:-}"
            [ -n "$value" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Valeur absente du fichier ET des secrets :$missing"
            exit 1
          fi
          echo "Configuration Firebase trouvee, projet=$resolved_FIREBASE_PROJECT_ID"

      # base-href doit correspondre au chemin réel de la Page (ex :
      # /ball-ruler-game/), sinon les assets ne se chargent pas.
      - name: Construire la version web
        run: |
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_MEASUREMENT_ID="$FIREBASE_MEASUREMENT_ID" \
            --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID" \
            --dart-define=FIREBASE_WEB_CLIENT_ID="$FIREBASE_WEB_CLIENT_ID"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
